# Catálogo Finviz: market cap, sectores, industries, themes y subthemes.
# Uso CLI:
#   --market-cap largeover|mid|…
#   --sector KEY | --industry KEY | --theme KEY | --subtheme KEY
#   --list [query]
# Fuente: https://finviz.com/screener
#
source: finviz
updated: '2026-09-24'
default_market_cap: largeover
notes: >-
  Keys CLI en minúsculas. market_cap usa el value Finviz (mega, largeover, …). Meta-filters de industry (Stocks
  only, ETF) omitidos.
market_caps:
- key: mega
  label: Mega ($200bln and more)
  filter: cap_mega
- key: large
  label: Large ($10bln to $200bln)
  filter: cap_large
- key: mid
  label: Mid ($2bln to $10bln)
  filter: cap_mid
- key: small
  label: Small ($300mln to $2bln)
  filter: cap_small
- key: micro
  label: Micro ($50mln to $300mln)
  filter: cap_micro
- key: nano
  label: Nano (under $50mln)
  filter: cap_nano
- key: largeover
  label: +Large (over $10bln)
  filter: cap_largeover
- key: midover
  label: +Mid (over $2bln)
  filter: cap_midover
- key: smallover
  label: +Small (over $300mln)
  filter: cap_smallover
- key: microover
  label: +Micro (over $50mln)
  filter: cap_microover
- key: largeunder
  label: -Large (under $200bln)
  filter: cap_largeunder
- key: midunder
